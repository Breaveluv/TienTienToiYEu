spring.application.name=TienTienYouthManagement

# ==========================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU (DATABASE & SPRING DATA JPA)
# ==========================================================
# Tự động tạo và cập nhật schema bảng theo Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Cấu hình kết nối Cloud Database Supabase PostgreSQL (Session Pooler IPv4)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.ijxtvldbdppqydogxnhm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Dung lượng upload tệp tối đa cho chức năng Đọc file danh sách
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Cấu hình Spring AI OpenAI:
# Cho phép truyền biến OPENAI_API_KEY qua Render Dashboard.
# Nếu chưa cài đặt, dùng placeholder để tránh ứng dụng bị crash khi khởi động (hệ thống sẽ tự động dùng smart local engine trong AiService).
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder-render-deployment}
