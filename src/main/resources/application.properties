spring.application.name=TienTienYouthManagement

# ==========================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU (DATABASE & SPRING DATA JPA)
# ==========================================================
# Tự động tạo và cập nhật schema bảng theo Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Cấu hình kết nối Database linh hoạt:
# - Mặc định dùng H2 file database (tương thích MySQL mode) để deploy lên Render chạy ngay không cần cài thêm DB ngoài
# - Khi có biến môi trường SPRING_DATASOURCE_URL trên Render (ví dụ kết nối MySQL/Aiven/Clever Cloud), Spring Boot sẽ tự động chuyển sang dùng DB đó
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tientien_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Dung lượng upload tệp tối đa cho chức năng Đọc file danh sách
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
