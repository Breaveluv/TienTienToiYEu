spring.application.name=TienTienYouthManagement

# ==========================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU (DATABASE & SPRING DATA JPA)
# ==========================================================
# Tự động tạo và cập nhật schema bảng theo Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Cấu hình kết nối MySQL (Mặc định cổng 3306, tự tạo database nếu chưa có)
spring.datasource.url=jdbc:mysql://localhost:3306/tientien_youth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dung lượng upload tệp tối đa cho chức năng Đọc file danh sách
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
