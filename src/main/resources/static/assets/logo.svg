<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Nodes -->
  <circle cx="120" cy="120" r="108" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="120" cy="120" r="100" fill="#0F172A" />

  <!-- Shield Base -->
  <path d="M120 28 L190 60 C190 135 155 180 120 206 C85 180 50 135 50 60 Z" fill="url(#primaryGrad)" opacity="0.15" />
  <path d="M120 36 L180 64 C180 130 150 170 120 195 C90 170 60 130 60 64 Z" stroke="url(#primaryGrad)" stroke-width="2.5" fill="none" />

  <!-- Flame / Torch of Youth Passion -->
  <path d="M120 54 C132 75 142 92 138 108 C135 120 125 126 120 126 C115 126 105 120 102 108 C98 92 108 75 120 54 Z" fill="url(#redGrad)" filter="url(#glow)" />
  <path d="M120 68 C126 82 132 94 130 104 C128 112 123 116 120 116 C117 116 112 112 110 104 C108 94 114 82 120 68 Z" fill="url(#goldGrad)" />

  <!-- Youth Pioneer Glowing Star -->
  <polygon points="120,80 125,93 139,94 128,103 132,116 120,108 108,116 112,103 101,94 115,93" fill="#FFFFFF" />

  <!-- Open Book of Knowledge / Development -->
  <path d="M78 142 C92 134 108 136 120 144 C132 136 148 134 162 142 L162 165 C148 156 132 158 120 166 C108 158 92 156 78 165 Z" fill="#38BDF8" opacity="0.9" />
  <path d="M120 144 L120 166" stroke="#0F172A" stroke-width="2" />

  <!-- Laurel Wreath of Advanced Youth -->
  <path d="M68 130 C62 110 65 88 78 72" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M172 130 C178 110 175 88 162 72" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="78" cy="72" r="3" fill="#F59E0B" />
  <circle cx="162" cy="72" r="3" fill="#F59E0B" />
  <circle cx="68" cy="100" r="3.5" fill="#F59E0B" />
  <circle cx="172" cy="100" r="3.5" fill="#F59E0B" />

  <!-- Digital Circuit Nodes at Bottom -->
  <circle cx="95" cy="182" r="4" fill="#38BDF8" />
  <circle cx="145" cy="182" r="4" fill="#38BDF8" />
  <path d="M95 182 L120 196 L145 182" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
